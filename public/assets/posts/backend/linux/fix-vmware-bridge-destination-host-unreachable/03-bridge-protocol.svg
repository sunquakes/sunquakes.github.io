<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="840" height="430" rx="14" fill="#f6f8fb"/>
  <text x="420" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#123a5c">Adapter Properties — only VMware Bridge Protocol is needed</text>

  <!-- Window -->
  <rect x="180" y="60" width="480" height="340" rx="10" fill="#ffffff" stroke="#b9cfe8" stroke-width="2"/>
  <rect x="180" y="60" width="480" height="40" rx="10" fill="#123a5c"/>
  <rect x="180" y="86" width="480" height="14" fill="#123a5c"/>
  <text x="200" y="86" font-size="14" font-weight="700" fill="#ffffff">Intel(R) Wi-Fi 6 AX201 160MHz Properties</text>

  <!-- Rows -->
  <g font-size="13.5" fill="#123a5c">
    <rect x="204" y="118" width="432" height="38" rx="6" fill="#f6f8fb"/>
    <rect x="216" y="129" width="18" height="18" rx="3" fill="#ffffff" stroke="#7ea6d9"/>
    <path d="M220 138 l4 4 l8 -10" stroke="#2f9e6e" stroke-width="2.2" fill="none"/>
    <text x="246" y="143">Client for Microsoft Networks</text>

    <rect x="204" y="164" width="432" height="38" rx="6" fill="#f6f8fb"/>
    <rect x="216" y="175" width="18" height="18" rx="3" fill="#ffffff" stroke="#7ea6d9"/>
    <path d="M220 184 l4 4 l8 -10" stroke="#2f9e6e" stroke-width="2.2" fill="none"/>
    <text x="246" y="189">File and Printer Sharing for Microsoft Networks</text>

    <rect x="204" y="210" width="432" height="38" rx="6" fill="#e9f6ef" stroke="#2f9e6e" stroke-width="1.5"/>
    <rect x="216" y="221" width="18" height="18" rx="3" fill="#ffffff" stroke="#2f9e6e"/>
    <path d="M220 230 l4 4 l8 -10" stroke="#2f9e6e" stroke-width="2.4" fill="none"/>
    <text x="246" y="235" font-weight="700">VMware Bridge Protocol</text>

    <rect x="204" y="256" width="432" height="38" rx="6" fill="#fdeceb" stroke="#d9534f" stroke-width="1.5"/>
    <rect x="216" y="267" width="18" height="18" rx="3" fill="#ffffff" stroke="#d9534f"/>
    <path d="M219 270 l12 12 M231 270 l-12 12" stroke="#d9534f" stroke-width="2.2" fill="none"/>
    <text x="246" y="281">DNE LightWeight Filter</text>

    <rect x="204" y="302" width="432" height="38" rx="6" fill="#fdeceb" stroke="#d9534f" stroke-width="1.5"/>
    <rect x="216" y="313" width="18" height="18" rx="3" fill="#ffffff" stroke="#d9534f"/>
    <path d="M219 316 l12 12 M231 316 l-12 12" stroke="#d9534f" stroke-width="2.2" fill="none"/>
    <text x="246" y="327">Npcap Packet Driver (NPCAP)</text>

    <rect x="204" y="348" width="432" height="38" rx="6" fill="#f6f8fb"/>
    <rect x="216" y="359" width="18" height="18" rx="3" fill="#ffffff" stroke="#7ea6d9"/>
    <path d="M220 368 l4 4 l8 -10" stroke="#2f9e6e" stroke-width="2.2" fill="none"/>
    <text x="246" y="374">Internet Protocol Version 4 (TCP/IPv4)</text>
  </g>

  <!-- Side legend -->
  <g font-size="12.5">
    <rect x="690" y="120" width="140" height="70" rx="8" fill="#e9f6ef" stroke="#2f9e6e"/>
    <text x="760" y="146" text-anchor="middle" font-weight="700" fill="#2f9e6e">✓ Check</text>
    <text x="760" y="170" text-anchor="middle" fill="#5b7186">VMware Bridge Protocol</text>

    <rect x="690" y="210" width="140" height="110" rx="8" fill="#fdeceb" stroke="#d9534f"/>
    <text x="760" y="236" text-anchor="middle" font-weight="700" fill="#d9534f">✕ Uncheck</text>
    <text x="760" y="260" text-anchor="middle" fill="#5b7186">DNE LightWeight Filter</text>
    <text x="760" y="282" text-anchor="middle" fill="#5b7186">Npcap / WinPcap</text>
    <text x="760" y="304" text-anchor="middle" fill="#5b7186">Vendor filter drivers</text>
  </g>
</svg>
