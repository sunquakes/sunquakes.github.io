<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Online meeting app with a participant video grid, an active speaker tile, a screen share tile and a document page opened in the preview panel where a collaborator cursor highlights a line">
